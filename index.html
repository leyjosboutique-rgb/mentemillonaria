<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Método de Volver a Elegirte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      --cream: #FBF7F6;
      --cream-2: #F6E7EC;
      --white: #FFFFFF;
      --pink: #FF7FAE;
      --pink-soft: #FBD6E4;
      --lavender: #C9A6E0;
      --lavender-soft: #F1E4F5;
      --wine: #200F1D;
      --wine-2: #3B1930;
      --brown: #7A6470;
      --gold: #D4AF6A;
      --cta: #E8195F;
      --cta-dark: #C10F4C;
      --line: rgba(32,15,29,.13);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Manrope", Arial, sans-serif;
      --shadow:
        0 30px 80px rgba(53,40,51,.12);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      background: var(--cream);
      color: var(--wine);
      font-family: var(--sans);
      line-height: 1.6;
      overflow-x: hidden;
    }
    img {
      display: block;
      width: 100%;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .container {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--brown);
    }
    .eyebrow::before {
      content: "";
      width: 30px;
      height: 1px;
      background: var(--gold);
    }
    .serif {
      font-family: var(--serif);
    }
    /* CTA */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 60px;
      padding: 0 36px;
      border-radius: 100px;
      background: var(--cta);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      box-shadow:
        0 15px 35px rgba(184,63,104,.25);
      transition: .3s ease;
      animation: ctaPulse 2.5s infinite;
    }
    .btn:hover {
      transform: translateY(-3px) scale(1.01);
      background: var(--cta-dark);
      box-shadow:
        0 20px 45px rgba(184,63,104,.35);
    }
    .btn-secondary {
      background: transparent;
      color: var(--wine);
      border: 1px solid var(--wine);
      box-shadow: none;
      animation: none;
    }
    .btn-secondary:hover {
      background: var(--wine);
      color: #fff;
      box-shadow: none;
    }
    @keyframes ctaPulse {
      0%, 100% {
        box-shadow:
          0 15px 35px rgba(184,63,104,.22);
      }
      50% {
        box-shadow:
          0 15px 45px rgba(184,63,104,.42);
      }
    }
    /* TOPBAR */
    .topbar {
      padding: 11px 15px;
      background: var(--wine);
      color: white;
      text-align: center;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar span {
      color: var(--pink);
      font-weight: 700;
      letter-spacing: normal;
    }
    /* HERO */
    .hero {
      padding: 90px 0 70px;
      text-align: center;
      background:
        radial-gradient(
          circle at 20% 0%,
          rgba(232,25,95,.16),
          transparent 45%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(201,166,224,.22),
          transparent 40%
        ),
        var(--cream);
      color: var(--wine);
    }
    .hero-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hero .eyebrow {
      justify-content: center;
      color: var(--cta);
    }
    .hero-copy {
      max-width: 780px;
    }
    .hero-title {
      font-family: var(--serif);
      font-size: clamp(46px, 6.4vw, 78px);
      line-height: .96;
      letter-spacing: -.03em;
      font-weight: 500;
    }
    .hero-title .accent {
      color: var(--cta);
    }
    .hero-steps {
      margin-top: 26px;
      display: grid;
      gap: 6px;
      font-family: var(--serif);
      font-size: 21px;
      line-height: 1.15;
      color: var(--brown);
    }
    .hero-steps span {
      color: var(--cta);
    }
    /* HERO CHIPS — franja continua estilo "ticker" */
    .hero-chips-marquee {
      margin-top: 28px;
      width: 100%;
      max-width: 100vw;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }
    .hero-chips {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-start;
      align-items: center;
      gap: 9px;
      width: max-content;
      animation: chipsMarquee 24s linear infinite;
    }
    .hero-chips-marquee:hover .hero-chips {
      animation-play-state: paused;
    }
    @keyframes chipsMarquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
    .hero-chip {
      display: inline-flex;
      align-items: center;
